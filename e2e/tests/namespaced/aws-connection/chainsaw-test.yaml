apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aws-connection-namespaced
  labels:
    suite: aws
# NEEDS YOUR AWS ACCOUNT: set the SCYLLADB_E2E_TGW_* variables (see e2e/README.md).
# Creates its own dedicated, billable cluster and a ClusterConnection
# (AWS_TGW_ATTACHMENT) to your Transit Gateway, for
# namespaced resources.
# Upstream creation waits until the connection is ACTIVE, so the attachment
# must be accepted on your side (or auto-accepted by the Transit Gateway).
spec:
  timeouts:
    # Upstream waits up to 90m for cluster deletion.
    delete: 95m
    cleanup: 95m
  steps:
    - name: check-variables
      try:
        - script:
            timeout: 10s
            content: |
              missing=""
              for v in SCYLLADB_E2E_TGW_ID SCYLLADB_E2E_TGW_RAM_ARN SCYLLADB_E2E_TGW_CIDRS; do
                eval "[ -n \"\${${v}:-}\" ]" || missing="${missing} ${v}"
              done
              if [ -n "${missing}" ]; then
                echo "Missing variables:${missing}. See e2e/README.md." >&2
                exit 1
              fi

    - name: create-cluster
      try:
        - apply:
            resource:
              apiVersion: scylladbcloud.scylladbcloud.m.crossplane.io/v1alpha1
              kind: Cluster
              metadata:
                name: e2e-ns-aws-connection
                labels:
                  e2e-test: "true"
              spec:
                forProvider:
                  name: e2e-ns-aws-connection
                  cloud: AWS
                  region: us-east-1
                  nodeType: t3.micro
                  minNodes: 3
                  cidrBlock: 172.31.0.0/16
                  # Upstream default; required by VPC peering.
                  enableVpcPeering: true
                  enableDns: true
                  # Don't keep backups of a throwaway test cluster after deletion.
                  backupRetentionDays: 0
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            # Upstream waits up to 40m for cluster creation.
            timeout: 45m
            resource:
              apiVersion: scylladbcloud.scylladbcloud.m.crossplane.io/v1alpha1
              kind: Cluster
              metadata:
                name: e2e-ns-aws-connection
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
                atProvider:
                  (clusterId > `0`): true
                  (length(datacenter || '') > `0`): true

    - name: cluster-connection
      try:
        - script:
            timeout: 30s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              to_yaml_list() { printf '[%s]' "$(printf '%s' "$1" | sed 's/[^,][^,]*/"&"/g')"; }
              CLUSTER_ID=$(${KUBECTL} get -n "${NAMESPACE}" clusters.scylladbcloud.scylladbcloud.m.crossplane.io/e2e-ns-aws-connection -o jsonpath='{.status.atProvider.clusterId}')
              DATACENTER=$(${KUBECTL} get -n "${NAMESPACE}" clusters.scylladbcloud.scylladbcloud.m.crossplane.io/e2e-ns-aws-connection -o jsonpath='{.status.atProvider.datacenter}')
              echo "Creating ClusterConnection for cluster ID ${CLUSTER_ID} in datacenter ${DATACENTER}"
              cat <<EOF | ${KUBECTL} apply -n "${NAMESPACE}" -f -
              apiVersion: scylladbcloud.scylladbcloud.m.crossplane.io/v1alpha1
              kind: ClusterConnection
              metadata:
                name: e2e-connection
                labels:
                  e2e-test: "true"
              spec:
                forProvider:
                  clusterId: ${CLUSTER_ID}
                  datacenter: ${DATACENTER}
                  name: e2e-connection
                  type: AWS_TGW_ATTACHMENT
                  cidrlist: $(to_yaml_list "${SCYLLADB_E2E_TGW_CIDRS}")
                  data:
                    tgwid: ${SCYLLADB_E2E_TGW_ID}
                    ramarn: ${SCYLLADB_E2E_TGW_RAM_ARN}
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
              EOF
        - assert:
            timeout: 45m
            resource:
              apiVersion: scylladbcloud.scylladbcloud.m.crossplane.io/v1alpha1
              kind: ClusterConnection
              metadata:
                name: e2e-connection
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
                atProvider:
                  type: AWS_TGW_ATTACHMENT
                  status: ACTIVE
      finally:
        - delete:
            ref:
              apiVersion: scylladbcloud.scylladbcloud.m.crossplane.io/v1alpha1
              kind: ClusterConnection
              name: e2e-connection
